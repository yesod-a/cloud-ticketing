server:
  port: "${SERVER_PORT:8082}"
spring:
  application:
    name: inventory-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
  datasource:
    url: ${INVENTORY_DB_URL:jdbc:mysql://localhost:3308/inventory_db?useSSL=false&serverTimezone=UTC}
    username: ${INVENTORY_DB_USERNAME:root}
    password: ${INVENTORY_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
cloudticket:
  internal-service-token: ${INTERNAL_SERVICE_TOKEN:dev-internal-token}
