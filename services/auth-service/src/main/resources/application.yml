spring:
  application:
    name: auth-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
  datasource:
    url: ${AUTH_DB_URL:jdbc:mysql://localhost:3306/cloud_ticketing_auth?useSSL=false&serverTimezone=UTC}
    username: ${AUTH_DB_USERNAME:root}
    password: ${AUTH_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${AUTH_SERVER_PORT:8081}
cloudticket:
  internal-service-token: ${INTERNAL_SERVICE_TOKEN:dev-internal-token}
