server:
  port: "${SERVER_PORT:8081}"
spring:
  application:
    name: activity-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 300ms
      timeout: 300ms
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
  datasource:
    url: ${ACTIVITY_DB_URL:jdbc:mysql://localhost:3308/activity_db?useSSL=false&serverTimezone=UTC}
    username: ${ACTIVITY_DB_USERNAME:root}
    password: ${ACTIVITY_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
cloudticket:
  inventory-base-url: ${INVENTORY_BASE_URL:http://inventory-service:8082}
  internal-service-token: ${INTERNAL_SERVICE_TOKEN:dev-internal-token}
  public-read-cache:
    enabled: ${PUBLIC_READ_CACHE_ENABLED:true}
    local-ttl-ms: ${PUBLIC_READ_CACHE_LOCAL_TTL_MS:3000}
    redis-ttl-ms: ${PUBLIC_READ_CACHE_REDIS_TTL_MS:30000}
