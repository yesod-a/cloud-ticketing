services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-cloudticket}"
    ports: ["3308:3306"]
    volumes: ["mysql_data:/var/lib/mysql", "./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h", "localhost"], interval: 5s, timeout: 5s, retries: 20 }
  redis:
    image: redis:7.4-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z@sha256:1dce27c494a16bae114774f1cec295493f3613142713130c2d22dd5696be6ad3
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin123}"
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
    healthcheck: { test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"], interval: 5s, timeout: 5s, retries: 20 }
  minio-init:
    image: minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 2; done;
      mc mb --ignore-existing local/$${MINIO_BUCKET}; mc anonymous set none local/$${MINIO_BUCKET}"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin123}"
      MINIO_BUCKET: "${MINIO_BUCKET:-cloudticket-activity}"
    depends_on: { minio: { condition: service_healthy } }
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  nacos:
    image: nacos/nacos-server:v2.5.1
    environment: { MODE: standalone, NACOS_AUTH_ENABLE: "false" }
  auth-service:
    build: { context: ., dockerfile: Dockerfile.auth }
    environment:
      AUTH_SERVER_PORT: 8081
      AUTH_DB_URL: "jdbc:mysql://mysql:3306/cloud_ticketing_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      AUTH_DB_USERNAME: root
      AUTH_DB_PASSWORD: "${MYSQL_ROOT_PASSWORD:-cloudticket}"
      AUTH_JWT_SIGNING_KEY: "${AUTH_JWT_SIGNING_KEY:-dev-only-change-me}"
      AUTH_ADMIN_PHONE: "${AUTH_ADMIN_PHONE:-}"
      AUTH_ADMIN_PASSWORD: "${AUTH_ADMIN_PASSWORD:-}"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-dev-internal-token}"
      AVATAR_STORAGE_DIR: "/var/lib/cloud-ticketing/avatars"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NACOS_SERVER_ADDR: nacos:8848
    volumes: ["auth_avatar_data:/var/lib/cloud-ticketing/avatars"]
    depends_on: { mysql: { condition: service_healthy }, redis: { condition: service_healthy }, nacos: { condition: service_started } }
    healthcheck: { test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"], interval: 10s, timeout: 5s, retries: 12 }
  activity-service:
    build: { context: ., dockerfile: Dockerfile.activity }
    environment:
      SERVER_PORT: 8081
      ACTIVITY_DB_URL: "jdbc:mysql://mysql:3306/activity_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      ACTIVITY_DB_USERNAME: root
      ACTIVITY_DB_PASSWORD: "${MYSQL_ROOT_PASSWORD:-cloudticket}"
      INVENTORY_BASE_URL: "http://inventory-service:8082"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-dev-internal-token}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PUBLIC_READ_CACHE_ENABLED: "${PUBLIC_READ_CACHE_ENABLED:-true}"
      PUBLIC_READ_CACHE_LOCAL_TTL_MS: "${PUBLIC_READ_CACHE_LOCAL_TTL_MS:-3000}"
      PUBLIC_READ_CACHE_REDIS_TTL_MS: "${PUBLIC_READ_CACHE_REDIS_TTL_MS:-30000}"
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_PUBLIC_ENDPOINT: "${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-minioadmin123}"
      MINIO_BUCKET: "${MINIO_BUCKET:-cloudticket-activity}"
      NACOS_SERVER_ADDR: nacos:8848
    depends_on: { mysql: { condition: service_healthy }, redis: { condition: service_healthy }, minio-init: { condition: service_completed_successfully }, nacos: { condition: service_started } }
  inventory-service:
    build: { context: ., dockerfile: Dockerfile.inventory }
    environment:
      SERVER_PORT: 8082
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      INVENTORY_DB_URL: "jdbc:mysql://mysql:3306/inventory_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      INVENTORY_DB_USERNAME: root
      INVENTORY_DB_PASSWORD: "${MYSQL_ROOT_PASSWORD:-cloudticket}"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-dev-internal-token}"
      CLOUDTICKET_SEAT_BITMAP_ENABLED: "${CLOUDTICKET_SEAT_BITMAP_ENABLED:-true}"
      CLOUDTICKET_REDIS_SEAT_LOCK_ENABLED: "${CLOUDTICKET_REDIS_SEAT_LOCK_ENABLED:-false}"
      CLOUDTICKET_INVENTORY_EVENTS_ENABLED: "${CLOUDTICKET_INVENTORY_EVENTS_ENABLED:-false}"
      CLOUDTICKET_INVENTORY_RECONCILIATION_ENABLED: "${CLOUDTICKET_INVENTORY_RECONCILIATION_ENABLED:-false}"
      NACOS_SERVER_ADDR: nacos:8848
    depends_on: { redis: { condition: service_healthy }, mysql: { condition: service_healthy }, kafka: { condition: service_started }, nacos: { condition: service_started } }
  order-service:
    build: { context: ., dockerfile: Dockerfile.order }
    environment:
      SERVER_PORT: 8083
      ORDER_DB_URL: "jdbc:mysql://mysql:3306/order_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      ORDER_DB_USERNAME: root
      ORDER_DB_PASSWORD: "${MYSQL_ROOT_PASSWORD:-cloudticket}"
      INVENTORY_BASE_URL: "http://inventory-service:8082"
      ACTIVITY_BASE_URL: "http://activity-service:8081"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-dev-internal-token}"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      ORDER_OUTBOX_ENABLED: "true"
      NACOS_SERVER_ADDR: nacos:8848
    depends_on: { mysql: { condition: service_healthy }, inventory-service: { condition: service_started }, kafka: { condition: service_started }, nacos: { condition: service_started } }
  gateway:
    build: { context: ., dockerfile: Dockerfile.gateway }
    environment:
      AUTH_JWT_SIGNING_KEY: "${AUTH_JWT_SIGNING_KEY:-dev-only-change-me}"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-dev-internal-token}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_STATUS_CACHE_ENABLED: "${AUTH_STATUS_CACHE_ENABLED:-true}"
      AUTH_STATUS_CACHE_LOCAL_TTL_MS: "${AUTH_STATUS_CACHE_LOCAL_TTL_MS:-1000}"
      AUTH_STATUS_CACHE_REDIS_TTL_MS: "${AUTH_STATUS_CACHE_REDIS_TTL_MS:-3000}"
      NACOS_SERVER_ADDR: nacos:8848
    ports: ["${GATEWAY_PORT:-8080}:8080"]
    depends_on: { auth-service: { condition: service_healthy }, redis: { condition: service_healthy }, nacos: { condition: service_started } }
  web:
    build: ./web
    ports: ["${WEB_PORT:-5173}:80"]
    depends_on: [gateway]
volumes: { mysql_data: {}, auth_avatar_data: {}, minio_data: {} }
