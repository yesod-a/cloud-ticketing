services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-cloudticket}"
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql", "./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h", "localhost"], interval: 5s, timeout: 5s, retries: 20 }
  redis:
    image: redis:7.4-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  nacos:
    image: nacos/nacos-server:v2.5.1
    environment: { MODE: standalone, NACOS_AUTH_ENABLE: "false" }
  auth-service:
    build: { context: ., dockerfile: Dockerfile.auth }
    environment:
      SERVER_PORT: 8084
      AUTH_JWT_SIGNING_KEY: "${AUTH_JWT_SIGNING_KEY:-dev-only-change-me}"
    depends_on: { mysql: { condition: service_healthy } }
    healthcheck: { test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"], interval: 10s, timeout: 5s, retries: 12 }
  activity-service: { build: { context: ., dockerfile: Dockerfile.activity } }
  inventory-service: { build: { context: ., dockerfile: Dockerfile.inventory } }
  order-service: { build: { context: ., dockerfile: Dockerfile.order } }
  gateway:
    build: { context: ., dockerfile: Dockerfile.gateway }
    environment:
      AUTH_JWT_SIGNING_KEY: "${AUTH_JWT_SIGNING_KEY:-dev-only-change-me}"
    ports: ["8080:8080"]
    depends_on: { auth-service: { condition: service_healthy } }
  web:
    build: ./web
    ports: ["5173:80"]
    depends_on: [gateway]
volumes: { mysql_data: {} }
