services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cloudticket}
      MYSQL_USER: ${MYSQL_USER:-cloudticket}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cloudticket}
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql", "./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }
  kafka:
    image: bitnami/kafka:3.9
    ports: ["${KAFKA_PORT:-9092}:9092"]
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092}
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      ALLOW_PLAINTEXT_LISTENER: yes
    healthcheck: { test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"], interval: 10s, timeout: 5s, retries: 15 }
  nacos:
    image: nacos/nacos-server:v2.5.1
    environment: { MODE: standalone, NACOS_AUTH_ENABLE: "false" }
    ports: ["${NACOS_PORT:-8848}:8848"]
    healthcheck: { test: ["CMD-SHELL", "curl -fsS http://localhost:8848/nacos/actuator/health"], interval: 10s, timeout: 5s, retries: 20 }
volumes: { mysql_data: {} }
